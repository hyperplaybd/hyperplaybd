<style>
:root{--bg:#0a0a0c;--bg2:#111115;--card:#16161b;--line:#25252d;--tx:#f3f3f5;--mu:#9a9aa6;--red:#e8202e;--red2:#ff4b57;--r:20px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Inter','Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;-webkit-font-smoothing:antialiased}
html[lang=bn] body{font-family:'Hind Siliguri','Inter',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:0;z-index:50;background:rgba(10,10,12,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.brand img{width:36px;height:36px;border-radius:9px}
.links{display:flex;gap:26px;color:var(--mu);font-size:15px}
.links a:hover{color:#fff}
.nr{display:flex;gap:10px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--mu);font:inherit;font-size:13px;padding:5px 13px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--red);color:#fff}
.btn{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--red),#b5121e);color:#fff;font-weight:600;border-radius:14px;padding:14px 26px;border:0;cursor:pointer;font:inherit;font-weight:600;box-shadow:0 10px 30px -10px rgba(232,32,46,.7);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.sm{padding:9px 18px;font-size:14px;border-radius:11px}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none}
.hero{position:relative;overflow:hidden;padding:90px 0 80px}
.hero:before{content:"";position:absolute;width:760px;height:760px;right:-200px;top:-260px;background:radial-gradient(circle,rgba(232,32,46,.28),transparent 65%)}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:50px;align-items:center;position:relative}
.pill{display:inline-block;font-size:13px;color:var(--red2);border:1px solid rgba(232,32,46,.4);background:rgba(232,32,46,.08);padding:5px 14px;border-radius:999px;margin-bottom:20px}
h1{font-size:clamp(36px,5.4vw,62px);line-height:1.12;letter-spacing:-.02em;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--red2),#ff9a5a);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--mu);font-size:18px;margin:20px 0 32px;max-width:520px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.meta{display:flex;gap:22px;margin-top:26px;color:var(--mu);font-size:14px;flex-wrap:wrap}
.meta b{color:var(--tx);font-weight:600}
.logo-card{aspect-ratio:1;max-width:340px;margin:auto;border-radius:44px;background:linear-gradient(160deg,#1c1c22,#0e0e11);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 40px 90px -30px rgba(232,32,46,.5);animation:fl 5s ease-in-out infinite}
.logo-card img{width:62%;border-radius:26px}
@keyframes fl{50%{transform:translateY(-12px)}}
section{padding:84px 0}
.alt{background:var(--bg2);border-block:1px solid var(--line)}
.eyebrow{color:var(--red2);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
h2{font-size:clamp(28px,3.6vw,40px);letter-spacing:-.015em;line-height:1.2;font-weight:700}
.sub{color:var(--mu);margin-top:12px;max-width:600px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.card .ic{width:46px;height:46px;border-radius:13px;background:rgba(232,32,46,.12);color:var(--red2);display:grid;place-items:center;font-size:22px;margin-bottom:18px}
.card h3{font-size:18px;margin-bottom:6px}
.card p{color:var(--mu);font-size:15px}
.steps{counter-reset:s}
.steps .card{position:relative}
.steps .card:before{counter-increment:s;content:counter(s);position:absolute;top:22px;right:24px;font-size:42px;font-weight:800;color:#232329}
#vph{margin-top:40px;aspect-ratio:16/9;max-width:960px;margin-inline:auto}
#vwrap{width:100%;height:100%;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#000;box-shadow:0 40px 80px -40px #000}
#vwrap.float{position:fixed;right:18px;bottom:18px;width:min(340px,calc(100vw - 36px));height:auto;aspect-ratio:auto;z-index:60;box-shadow:0 20px 60px #000c;animation:up .4s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.stage{position:relative;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:radial-gradient(120% 90% at 80% 0,#2a0b10 0,#0b0b0e 55%);color:#fff}
.stage:after{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:4cqw 4cqw;mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent);pointer-events:none}
.sc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6cqw;padding:4cqw 7cqw;opacity:0;visibility:hidden;transition:opacity .5s;z-index:1}
.sc.on{opacity:1;visibility:visible}
.sc .tx{max-width:44cqw}
.sc.c{flex-direction:column;text-align:center;gap:2cqw}
.badge{display:inline-block;font-size:1.6cqw;font-weight:700;letter-spacing:.1em;color:var(--red2);background:rgba(232,32,46,.14);border:1px solid rgba(232,32,46,.4);padding:.5cqw 1.6cqw;border-radius:99px;margin-bottom:1.8cqw}
.tt{font-size:4.2cqw;font-weight:800;line-height:1.18;letter-spacing:-.01em}
.sc.c .tt{font-size:5.2cqw}
.ds{font-size:2cqw;color:#b4b4bf;margin-top:1.4cqw;line-height:1.5}
.sc.on .tx>*,.sc.on .lg,.sc.on .tt,.sc.on .ds{animation:slide .7s both}
.sc.on .tx>*:nth-child(2){animation-delay:.15s}.sc.on .tx>*:nth-child(3){animation-delay:.3s}
.sc.on .ds{animation-delay:.3s}
@keyframes slide{from{opacity:0;transform:translateY(2.4cqw)}}
.lg{width:11cqw;border-radius:2.6cqw;box-shadow:0 0 6cqw rgba(232,32,46,.55)}
.shot{position:relative;container-type:inline-size;width:26cqw;flex:none}
.sc.on .shot{animation:pop .8s cubic-bezier(.2,1.2,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateX(-4cqw) scale(.85) rotate(-3deg)}}
.shot img.sh{display:block;width:100%;border-radius:6.5%/4.8%;box-shadow:0 3cqw 6cqw -1cqw #000,0 0 0 1px #ffffff18}
.shot.w{width:36cqw}.shot.w img.sh{border-radius:2.4%/4%}
.ring{position:absolute;transform:translate(-50%,-50%);border:.45cqw solid var(--red2);border-radius:99px;opacity:0;pointer-events:none;box-shadow:0 0 4cqw rgba(255,75,87,.8)}
.sc.on .ring{animation:rg 1.4s 1.1s infinite}
@keyframes rg{0%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}30%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.tap{position:absolute;width:5cqw;height:5cqw;transform:translate(-30%,-20%);opacity:0;pointer-events:none}
.sc.on .tap{animation:tp 1.4s 1.3s infinite}
@keyframes tp{0%{opacity:0;transform:translate(40%,80%)}35%{opacity:1;transform:translate(-30%,-20%)}55%{transform:translate(-30%,-20%) scale(.85)}100%{opacity:0}}
.en{position:relative;width:100%;background:#303030;border-radius:6.5%/4.8%;overflow:hidden;font-family:Roboto,Inter,system-ui,sans-serif;color:#e6e6e6;box-shadow:0 3cqw 6cqw -1cqw #000,0 0 0 1px #ffffff18}
.en.dk{background:#1b1d1f;border-radius:1.6%/3%}
.en>*{position:absolute;margin:0}
.en .c{left:5%;right:5%;text-align:center}
.en .l{left:7.2%;right:7.2%}
.en .row{left:7.2%;right:7.2%;background:#202124;border-radius:99px;display:flex;align-items:center;gap:6%;padding:0 5%;font-size:6cqw;color:#fff}
.en .row img{width:10%;border-radius:4px}
.en .bt{left:7.2%;right:7.2%;background:#d3e3fd;color:#041e49;text-align:center;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:4cqw;font-weight:500}
.en .lk{font-size:4cqw;color:#e6e6e6;text-decoration:underline;left:7.2%}
.ctl{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:1.4cqw;padding:1.6cqw 2cqw;background:linear-gradient(transparent,#000d)}
.ctl button,.ctl select{border:0;background:#ffffff1f;color:#fff;font:inherit;border-radius:1.2cqw;height:4.6cqw;min-width:4.6cqw;padding:0 1.2cqw;cursor:pointer;font-size:max(2cqw,11px);backdrop-filter:blur(6px)}
.ctl button:hover{background:#ffffff38}
.ctl select{appearance:none;padding:0 1.6cqw}
.ctl select option{color:#000}
.bar{flex:1;height:.9cqw;min-height:5px;background:#ffffff30;border-radius:9px;cursor:pointer;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--red2);border-radius:9px;width:0}
.bar i:after{content:"";position:absolute;right:-.7cqw;top:50%;width:1.7cqw;height:1.7cqw;transform:translateY(-50%);background:#fff;border-radius:50%}
.tm{font-size:max(1.8cqw,10px);color:#ddd;font-variant-numeric:tabular-nums;min-width:8ch;text-align:right}
.big{position:absolute;inset:0;z-index:4;display:none;place-items:center;background:#0008;cursor:pointer}
.big.show{display:grid}
.big span{width:11cqw;height:11cqw;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:4.5cqw;box-shadow:0 0 6cqw rgba(232,32,46,.7)}
.xbtn{display:none}
#vwrap.float .xbtn{display:block;position:absolute;z-index:9;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:#000b;color:#fff;cursor:pointer}
.stage.paused *{animation-play-state:paused!important}
.fix{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:44px}
.fix .card{text-align:center}
.fix .shot{width:100%;margin:0 auto 20px}
.fix .shot.w{width:100%}
.fix .shot .ring,.fix .shot .tap{animation:none!important}
.fix .shot .ring{opacity:1}
.fix .shot .tap{display:none}
.note{margin-top:30px;background:rgba(232,32,46,.07);border:1px solid rgba(232,32,46,.3);border-radius:var(--r);padding:20px 24px;color:#ddd;font-size:15px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px;margin-top:12px}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.faq summary:after{content:"+";color:var(--red2);font-size:22px;line-height:1}
.faq details[open] summary:after{content:"–"}
.faq p{color:var(--mu);margin-top:10px;font-size:15px}
.final{text-align:center}
.final .sub{margin-inline:auto;margin-bottom:28px}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mu);font-size:14px;text-align:center}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}.logo-card{max-width:220px;order:-1}.links{display:none}.grid3,.fix{grid-template-columns:1fr}.fix .card{max-width:420px;margin-inline:auto}.hero{padding:50px 0}section{padding:60px 0}.nr .btn{display:none}}
@media(prefers-reduced-motion:reduce){.logo-card{animation:none}}
</style>
</head>

const stage=document.getElementById('stage');

sc.innerHTML=shot(i,1)+`<div class="tx"><span class="badge">${t.st} ${i}</span><div class="tt">${t['v'+i+'t']}</div><div class="ds">${t['v'+i+'d']}</div></div>`;}
stage.querySelectorAll('[data-v]').forEach(e=>{const k=e.dataset.v;e.textContent=t[k+'v']});
}
function fix(){const t=T[L];document.getElementById('fix').innerHTML=[1,2,3].map(i=>`<div class="card">${shot(i,1)}<span class="badge" style="font-size:12px;padding:3px 12px;background:rgba(232,32,46,.14);border:1px solid rgba(232,32,46,.4);border-radius:99px;color:#ff4b57;font-weight:700">${t.st} ${i}</span><h3 style="margin-top:12px">${t['v'+i+'t']}</h3><p>${t['v'+i+'d']}</p></div>`).join('')}
function setLang(l){L=l;document.documentElement.lang=l;
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[l][e.dataset.i]);
document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.l==l));
document.getElementById('vl').value=l;scenes();fix();show(cur,true)}
/* timeline */
const D=[4,6,6,6,4],TOT=26;let t=0,playing=false,cur=-1,last=0,started=false;
const $=id=>document.getElementById(id);
function show(i,force){if(i<0||(i==cur&&!force))return;cur=i;const all=stage.querySelectorAll('.sc');all.forEach(s=>s.classList.remove('on'));void stage.offsetWidth;all[i].classList.add('on')}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,'0')}
function ui(){$('fill').style.width=(t/TOT*100)+'%';$('tm').textContent=fmt(t)+" / "+fmt(TOT);$('pp').textContent=playing?"❚❚":"▶";stage.classList.toggle('paused',!playing);$('big').classList.toggle('show',!playing&&t<=0.01)}
function sceneAt(x){let a=0;for(let i=0;i<D.length;i++){a+=D[i];if(x<a)return i}return D.length-1}
function tick(n){if(playing){t+=(n-last)/1000;if(t>=TOT){t=TOT;playing=false}}last=n;show(sceneAt(t));ui();requestAnimationFrame(tick)}
function play(){if(t>=TOT)t=0;playing=true;started=true;show(sceneAt(t),true)}
$('pp').onclick=()=>playing?(playing=false):play();
$('big').onclick=play;
$('rs').onclick=()=>{t=0;show(0,true);play()};
$('st').onclick=()=>{playing=false;t=0;show(0,true)};
$('bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();t=Math.max(0,Math.min(TOT-.01,(e.clientX-r.left)/r.width*TOT));show(sceneAt(t),true)};
$('vl').onchange=e=>setLang(e.target.value);
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
/* floating mini player */
const w=$('vwrap'),ph=$('vph');let closed=false;
new IntersectionObserver(([e])=>{const out=!e.isIntersecting&&e.boundingClientRect.top<0;
w.classList.toggle('float',out&&started&&!closed);if(e.isIntersecting){closed=false}},{threshold:.25}).observe(ph);
$('xb').onclick=()=>{closed=true;playing=false;w.classList.remove('float')};
new IntersectionObserver(([e])=>{if(e.isIntersecting&&!started&&t==0)play()},{threshold:.6}).observe(ph);
setLang('bn');requestAnimationFrame(n=>{last=n;tick(n)});
